name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pytest -q

  wp-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: PHP syntax check
        run: |
          php --version | head -1
          find wp-plugin -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Build the plugin zip
        run: cd wp-plugin && zip -r ../sitewell-bridge.zip sitewell-bridge
      - uses: actions/upload-artifact@v4
        with:
          name: sitewell-bridge
          path: sitewell-bridge.zip
